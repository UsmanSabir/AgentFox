name: Release

# Builds AgentFox + the Trading plugin for every supported OS/arch and publishes
# the archives to a GitHub Release. Archive names match what install.ps1 / install.sh
# download: agentfox-<rid>.zip (Windows) and agentfox-<rid>.tar.gz (Linux/macOS).

on:
  push:
    tags:
      - 'v*'            # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit release tag (e.g. v1.2.3). Leave blank to auto-increment as MAJOR.MINOR.<run_number>.'
        required: false

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  # ── Version ────────────────────────────────────────────────────────────────
  # Computes the build version once and shares it with every matrix build.
  #   • Tag push (v1.2.3) or explicit dispatch tag  → that exact version.
  #   • Manual run with no tag                       → MAJOR.MINOR.<run_number>
  #     (MAJOR.MINOR read from <VersionPrefix> in AgentFox.csproj), auto-tagged.
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}   # e.g. 1.0.42
      info:    ${{ steps.ver.outputs.info }}       # e.g. 1.0.42+ab12cd3
      tag:     ${{ steps.ver.outputs.tag }}        # e.g. v1.0.42
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # MAJOR.MINOR base from the project file (portable sed — runs on ubuntu)
          BASE=$(sed -n 's/.*<VersionPrefix>\([0-9]*\.[0-9]*\).*/\1/p' src/Agent/AgentFox.csproj | head -1)
          [ -z "$BASE" ] && BASE=1.0

          REF="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            TAG="$REF"
            VERSION="${REF#v}"
          else
            VERSION="${BASE}.${{ github.run_number }}"
            TAG="v${VERSION}"
          fi

          SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "info=$VERSION+$SHA"    >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
          echo "AgentFox build version: $VERSION+$SHA  (tag $TAG)"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, archive: zip }
          - { rid: win-arm64,   os: windows-latest, archive: zip }
          - { rid: linux-x64,   os: ubuntu-latest,  archive: tar }
          - { rid: linux-arm64, os: ubuntu-latest,  archive: tar }
          - { rid: osx-x64,     os: macos-latest,   archive: tar }
          - { rid: osx-arm64,   os: macos-latest,   archive: tar }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build the SvelteKit web UI. The static adapter writes to src/Agent/wwwroot,
      # which AgentFox.csproj embeds as EmbeddedResource. Must run BEFORE dotnet
      # publish so the files exist when MSBuild compiles the assembly.
      - name: Build web UI (wwwroot)
        shell: bash
        run: npm ci && npm run build
        working-directory: src/frontend

      # Single-file publish embeds wwwroot + the local-embeddings ONNX model + native
      # libs into the exe. PublishSingleFile=true flows into the referenced
      # LocalEmbeddings project, firing its EmbedLocalEmbeddingsModel target (the model
      # is downloaded automatically at build time by LocalEmbeddings.targets).
      - name: Publish AgentFox
        shell: bash
        run: >
          dotnet publish src/Agent/AgentFox.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UseAppHost=true
          -p:Version=${{ needs.version.outputs.version }}
          -p:InformationalVersion=${{ needs.version.outputs.info }}
          -o staging/${{ matrix.rid }}

      - name: Publish Trading plugin
        shell: bash
        run: >
          dotnet publish src/Plugins/TradingAgent/TradingAgent.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained false
          -o staging/${{ matrix.rid }}/plugins/TradingAgent

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path staging/${{ matrix.rid }}/* -DestinationPath agentfox-${{ matrix.rid }}.zip -Force

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf agentfox-${{ matrix.rid }}.tar.gz -C staging/${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentfox-${{ matrix.rid }}
          path: agentfox-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Uses the version job's computed tag. On a manual run with no tag input this
      # creates a fresh v<MAJOR.MINOR.run_number> tag at the current commit.
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AgentFox ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
